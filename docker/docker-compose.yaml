name: fastbot_humble

services:
  fastbot-humble-container:
    image: theconstructai/fastbot:humble
    pull_policy: always
    privileged: true
    network_mode: host
    container_name: fastbot-humble
    environment:
      - ROBOT_NAME=fastbot_X
      - RMW_IMPLEMENTAION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=/var/lib/theconstruct.rrl/cyclonedds.xml
    volumes:
      - /var/lib/theconstruct.rrl/cyclonedds.xml:/var/lib/theconstruct.rrl/cyclonedds.xml
      - /dev:/dev
      - ./volumes/ros_entrypoint.sh:/ros_entrypoint.sh
      - ./volumes/bringup.sh:/bringup.sh
      - ./volumes/bringup.launch.xml:/root/ros2_ws/install/fastbot_bringup/share/fastbot_bringup/launch/bringup.launch.xml 
      - ./volumes/rplidar.launch.xml:/root/ros2_ws/install/fastbot_bringup/share/fastbot_bringup/launch/rplidar.launch.xml   
      - ./volumes/rplidar.launch.py:/root/ros2_ws/install/rplidar_ros/share/rplidar_ros/launch/rplidar.launch.py    
      - ./volumes/laser_scan_matcher.launch.py:/root/ros2_ws/install/fastbot_bringup/share/fastbot_bringup/launch/laser_scan_matcher.launch.py
      - ./volumes/gripper_as.py:/root/ros2_ws/install/fastbot_firmware/lib/fastbot_firmware/gripper_as.py
      - ./volumes/differential_multi.py:/root/ros2_ws/install/fastbot_firmware/lib/fastbot_firmware/differential_multi.py
      - ./volumes/fastbot_body.xacro:/root/ros2_ws/install/fastbot_description/share/fastbot_description/models/urdf/fastbot_body.xacro
    entrypoint: /ros_entrypoint.sh
    command: ["/bringup.sh"]
    restart: always
